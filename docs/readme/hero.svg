<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">OpenCPQ</title>
  <desc id="desc">A quote document and pricing cards connected in a modern blue interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".55" stop-color="#172554"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1280" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="1180" cy="30" r="240" fill="#22d3ee" opacity=".08"/>
  <g transform="translate(76 104)">
    <rect width="86" height="8" rx="4" fill="url(#accent)"/>
    <text y="80" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="62" font-weight="800">OpenCPQ</text>
    <text y="128" fill="#bae6fd" font-family="Inter,Segoe UI,sans-serif" font-size="24">Turn complexity into confident quotes.</text>
    <text y="190" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="17">CONFIGURE • PRICE • QUOTE</text>
  </g>
  <g transform="translate(770 52)" filter="url(#shadow)">
    <rect x="58" width="348" height="376" rx="24" fill="#ffffff"/>
    <rect x="84" y="28" width="116" height="10" rx="5" fill="#0ea5e9"/>
    <text x="84" y="76" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="750">Commercial proposal</text>
    <rect x="84" y="106" width="296" height="44" rx="10" fill="#f0f9ff"/>
    <rect x="100" y="123" width="150" height="10" rx="5" fill="#7dd3fc"/>
    <rect x="84" y="168" width="296" height="44" rx="10" fill="#f8fafc"/>
    <rect x="100" y="185" width="190" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="84" y="230" width="136" height="86" rx="14" fill="#ecfeff"/>
    <text x="102" y="258" fill="#0e7490" font-family="Inter,Segoe UI,sans-serif" font-size="12">MARGIN</text>
    <text x="102" y="294" fill="#155e75" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="800">32%</text>
    <rect x="236" y="230" width="144" height="86" rx="14" fill="#eff6ff"/>
    <text x="254" y="258" fill="#1d4ed8" font-family="Inter,Segoe UI,sans-serif" font-size="12">TOTAL</text>
    <text x="254" y="294" fill="#1e3a8a" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="800">€ 18,400</text>
    <rect x="84" y="338" width="296" height="12" rx="6" fill="url(#accent)"/>
    <rect x="0" y="64" width="94" height="74" rx="16" fill="#082f49" stroke="#38bdf8"/>
    <text x="18" y="94" fill="#7dd3fc" font-family="Inter,Segoe UI,sans-serif" font-size="12">RESOURCES</text>
    <text x="18" y="121" fill="#f0f9ff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">24</text>
  </g>
</svg>
